<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Ligne Daladier</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2d2d2d;
    color:#e5e5e5;
    font-family:'Roboto',sans-serif;
    min-height:100vh;
}

/* TEXTURE BÉTON */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("https://www.transparenttextures.com/patterns/concrete-wall.png");
    opacity:0.15;
    pointer-events:none;
}

/* HEADER */

header{
    background:#4a4f45;
    border-bottom:4px solid #111;
    padding:25px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.5);
}

header h1{
    font-family:'Oswald',sans-serif;
    font-size:4rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#d9d7c8;
    text-shadow:3px 3px 0 #111;
}

/* LAYOUT */

.container{
    display:flex;
    min-height:calc(100vh - 120px);
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:#3a3f36;
    border-right:4px solid #111;
    padding:30px 20px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:25px;
}

.sidebar a{
    text-decoration:none;
    color:#d7d7d7;
    font-size:1.4rem;
    font-weight:bold;
    display:block;
    padding:12px;
    border-left:5px solid transparent;
    transition:0.3s;
}

.sidebar a:hover{
    background:#55614f;
    border-left:5px solid #c2b280;
    padding-left:20px;
}

/* CONTENU */

.content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
    position:relative;
}

/* EFFET PLAQUE MILITAIRE */

.hero{
    background:rgba(40,40,40,0.8);
    border:3px solid #555;
    padding:60px;
    max-width:900px;
    box-shadow:
        inset 0 0 20px rgba(255,255,255,0.05),
        0 0 20px rgba(0,0,0,0.7);
}

.hero h2{
    font-family:'Oswald',sans-serif;
    font-size:4rem;
    line-height:1.3;
    text-transform:uppercase;
    color:#d8d2b0;
    text-shadow:2px 2px 0 #000;
}

/* RESPONSIVE */

@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:4px solid #111;
    }

    .sidebar ul{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
    }

    .sidebar li{
        margin-bottom:0;
    }

    .sidebar a{
        font-size:1rem;
        padding:10px 15px;
        border-left:none;
        border-bottom:3px solid transparent;
    }

    .sidebar a:hover{
        padding-left:15px;
        border-left:none;
        border-bottom:3px solid #c2b280;
    }

    header h1{
        font-size:2.5rem;
    }

    .hero{
        padding:30px;
    }

    .hero h2{
        font-size:2rem;
    }
}

</style>
</head>

<body>

<header>
    <h1>La Ligne Daladier</h1>
</header>

<div class="container">

    <nav class="sidebar">
        <ul>
            <li><a href="apropos.html">Qu'est-ce que la ligne Daladier ?</a></li>
            <li><a href="aceuilcarte.html">Cartographie</a></li>
            <li><a href="#">Les casemates</a></li>
            <li><a href="#">Dico</a></li>
            <li><a href="#">Informations</a></li>
            <li><a href="#">Mises à jours</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main class="content">
        <div class="hero">
            <h2>
                Découvrir la partie nord<br>
                de la Ligne Maginot
            </h2>
        </div>
    </main>

</div>

</body>
</html>
