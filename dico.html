<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/png" href="https://i.postimg.cc/q72Svmqk/Design-sans-titre-(31).png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La Ligne Daladier - Dico</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#2b2d2a;
    color:#e5e5e5;
    font-family:'Roboto',sans-serif;
}

/* texture béton */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("https://www.transparenttextures.com/patterns/concrete-wall.png");
    opacity:0.15;
    pointer-events:none;
}

/* HEADER */
header{
    background:#4a4f45;
    border-bottom:4px solid #111;
    padding:25px;
    text-align:center;
}

header h1{
    font-family:'Oswald',sans-serif;
    font-size:3.5rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#d9cf9c;
    text-shadow:3px 3px 0 #111;
}

/* LAYOUT */
.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:280px;
    background:#3a3f36;
    border-right:4px solid #111;
    padding:30px 20px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    margin-bottom:25px;
}

.sidebar a{
    text-decoration:none;
    color:#d7d7d7;
    font-size:1.3rem;
    font-weight:bold;
    display:block;
    padding:12px;
    border-left:5px solid transparent;
    transition:0.3s;
}

.sidebar a:hover{
    background:#55614f;
    border-left:5px solid #c2b280;
    padding-left:20px;
}

/* CONTENT */
.content{
    flex:1;
    padding:40px;
    display:flex;
    justify-content:center;
}

/* GRILLE */
.grid{
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

/* CASE CLIQUABLE */
.card{
    display:block;
    text-decoration:none;
    background:rgba(40,40,40,0.85);
    border:3px solid #555;
    box-shadow:0 0 15px rgba(0,0,0,0.6);
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
    border-color:#c2b280;
}

/* IMAGE */
.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
    filter:contrast(1.1) brightness(0.9);
}

/* TEXTE */
.card h2{
    font-family:'Oswald',sans-serif;
    font-size:1.5rem;
    color:#d9cf9c;
    text-transform:uppercase;
    padding:15px;
    text-align:center;
}

/* CASE CENTRALE */
.center{
    grid-column:1 / 3;
}

/* RESPONSIVE */
@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        border-right:none;
        border-bottom:4px solid #111;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .center{
        grid-column:auto;
    }
}

</style>
</head>

<body>

<header>
    <h1>La Ligne Daladier - Dico</h1>
</header>

<div class="container">

    <nav class="sidebar">
        <ul>
            <li><a href="apropos.html">Qu'est-ce que la ligne Daladier ?</a></li>
            <li><a href="aceuilcartes.html">Cartographie</a></li>
            <li><a href="blockhaus.html">Les casemates</a></li>
            <li><a href="dico.html">Dico</a></li>
            <li><a href="info.html">Informations</a></li>
            <li><a href="nouveautees.html">Mises à jours</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main class="content">

        <div class="grid">

            <!-- PLAN TYPES -->
            <a href="plans.html" class="card">
                <img src="images/plans.png" alt="Plans types blockhaus">
                <h2>Plans types</h2>
            </a>

            <!-- EQUIPEMENT -->
            <a href="equipement.html" class="card">
                <img src="images/cloche.jpg" alt="Équipement et armement">
                <h2>Équipement / Armement</h2>
            </a>

            <!-- TERMES -->
            <a href="termes.html" class="card center">
                <h2>Termes utilisés</h2>
            </a>

        </div>

    </main>

</div>

</body>
</html>
